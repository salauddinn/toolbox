services:
  - type: web
    name: toolbox
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TOOLBOX_SESSION_SECRET
        generateValue: true
      - key: TOOLBOX_DETERMINISTIC_GENERATION
        value: "0"
